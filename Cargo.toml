[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
opt-level = "z"   # V3: smallest code; keeps the needed extend small (~9 KB). "s" build is kept for comparison.
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
